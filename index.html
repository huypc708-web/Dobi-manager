<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - License Management</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0e14;
            color: #94a3b8;
            padding: 30px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .dashboard-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 600;
        }
        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
        }
        .section-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .section-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
        }
        .btn-create {
            background-color: #ffffff;
            color: #0b0e14;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-create:hover {
            background-color: #e2e8f0;
        }
        .filters-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .search-box, select {
            background-color: #131822;
            border: 1px solid #1e293b;
            color: #ffffff;
            padding: 9px 14px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        .search-box {
            flex: 1;
            min-width: 250px;
        }
        .search-box::placeholder {
            color: #64748b;
        }
        select {
            cursor: pointer;
            color: #cbd5e1;
        }
        .table-container {
            background-color: #131822;
            border: 1px solid #1e293b;
            border-radius: 8px;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }
        th {
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            padding: 14px 16px;
            border-bottom: 1px solid #1e293b;
        }
        td {
            padding: 24px 16px;
            border-bottom: 1px solid #1e293b;
            color: #cbd5e1;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            font-size: 14px;
        }
        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }
        .badge-active { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .badge-banned { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        
        /* Modal Popup tạo key phong cách AuthFusion */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #131822;
            border: 1px solid #1e293b;
            padding: 25px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
        }
        .modal-content h3 { color: #fff; margin-bottom: 15px; font-size: 16px; }
        .modal-content input, .modal-content select { width: 100%; margin-bottom: 12px; }
        .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
        .btn-cancel { background: #334155; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Header -->
        <div class="header-top">
            <div class="dashboard-title">Dashboard</div>
            <div class="status-badge">Online</div>
        </div>

        <!-- Section Title & Create Button -->
        <div class="section-title-row">
            <div class="section-title">License Management</div>
            <button class="btn-create" onclick="openModal()">+ Create License</button>
        </div>

        <!-- Filters Bar -->
        <div class="filters-bar">
            <input type="text" class="search-box" placeholder="Search licenses by key..." id="searchInput" onkeyup="filterTable()">
            <select id="statusFilter" onchange="filterTable()">
                <option value="">All Status</option>
                <option value="Active">Active</option>
                <option value="Banned">Banned</option>
            </select>
            <select id="hwidFilter" onchange="filterTable()">
                <option value="">All HWID</option>
                <option value="bound">Bound</option>
                <option value="unbound">Unbound</option>
            </select>
            <select>
                <option>Select Application</option>
                <option>DOBI AIMBOT v1</option>
            </select>
        </div>

        <!-- License Table -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 35%;">License Key</th>
                        <th style="width: 25%;">Status ( HWID )</th>
                        <th style="width: 25%;">Expiry</th>
                        <th style="width: 15%;">Actions</th>
                    </tr>
                </thead>
                <tbody id="licenseTableBody">
                    <tr>
                        <td colspan="4" class="empty-state" id="emptyRow">Select an application to view licenses.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Tạo Key -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <h3>Create New License</h3>
            <select id="newApp">
                <option>DOBI AIMBOT v1</option>
            </select>
            <select id="newDuration">
                <option value="1">1 Day</option>
                <option value="7" selected>7 Days</option>
                <option value="30">30 Days</option>
                <option value="365">Lifetime / Permanent</option>
            </select>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-create" onclick="createNewKey()">Generate</button>
            </div>
        </div>
    </div>

    <script>
        let licenses = [];

        function openModal() {
            document.getElementById("createModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("createModal").style.display = "none";
        }

        function createNewKey() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let part1 = "", part2 = "", part3 = "";
            for (let i = 0; i < 4; i++) part1 += chars.charAt(Math.floor(Math.random() * chars.length));
            for (let i = 0; i < 4; i++) part2 += chars.charAt(Math.floor(Math.random() * chars.length));
            for (let i = 0; i < 4; i++) part3 += chars.charAt(Math.floor(Math.random() * chars.length));
            
            const keyString = `DOBI-${part1}-${part2}-${part3}`;
            const days = parseInt(document.getElementById("newDuration").value);
            const expireAt = days === 365 ? "Lifetime" : Math.floor(Date.now() / 1000) + (days * 86400);

            licenses.push({
                key: keyString,
                status: "Active",
                hwid: "Unbound",
                expiry: expireAt
            });

            renderTable(licenses);
            closeModal();
        }

        function renderTable(data) {
            const tbody = document.getElementById("licenseTableBody");
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No licenses found.</td></tr>`;
                return;
            }

            tbody.innerHTML = "";
            data.forEach((item, index) => {
                let expiryText = item.expiry === "Lifetime" ? "Lifetime" : formatCountdown(item.expiry);
                tbody.innerHTML += `
                    <tr>
                        <td><code style="color: #38bdf8;">${item.key}</code></td>
                        <td><span class="badge badge-active">${item.status}</span> <span style="font-size: 12px; color: #64748b;">(${item.hwid})</span></td>
                        <td class="${item.expiry !== 'Lifetime' ? 'countdown-item' : ''}" data-time="${item.expiry}">${expiryText}</td>
                        <td>
                            <button onclick="resetHwid(${index})" style="background:#1e293b; color:#38bdf8; border:1px solid #334155; padding:5px 10px; border-radius:4px; cursor:pointer; font-size:12px;">Reset HWID</button>
                        </td>
                    </tr>
                `;
            });
        }

        function resetHwid(index) {
            licenses[index].hwid = "Unbound";
            renderTable(licenses);
            alert("HWID has been successfully reset!");
        }

        function filterTable() {
            const keyword = document.getElementById("searchInput").value.toLowerCase();
            const filtered = licenses.filter(item => item.key.toLowerCase().includes(keyword));
            renderTable(filtered);
        }

        function formatCountdown(expireTimestamp) {
            const now = Math.floor(Date.now() / 1000);
            const diff = expireTimestamp - now;
            if (diff <= 0) return "Expired";
            let days = Math.floor(diff / 86400);
            let hours = Math.floor((diff % 86400) / 3600);
            let mins = Math.floor((diff % 3600) / 60);
            return `${days}d ${hours}h ${mins}m left`;
        }

        // Cập nhật bộ đếm thời gian thực mỗi giây
        setInterval(() => {
            document.querySelectorAll(".countdown-item").forEach(el => {
                const timestamp = parseInt(el.getAttribute("data-time"));
                if (!isNaN(timestamp)) {
                    el.innerText = formatCountdown(timestamp);
                }
            });
        }, 1000);
    </script>
</body>
</html>
