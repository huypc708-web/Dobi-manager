<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOBI MANAGER - Key System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #161616;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #262626;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            letter-spacing: 1px;
            color: #f1f1f1;
        }
        p {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .status-box {
            background: #1f1f1f;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
            font-size: 14px;
            color: #ddd;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DOBI X MANAGER</h1>
        <p>Hệ thống xác thực Key tự động</p>
        
        <div class="status-box">
            Trạng thái API: <span style="color: #4CAF50; font-weight: bold;">Đang hoạt động (Online)</span>
        </div>

        <div class="footer">
            &copy; 2026 Dobi Project. All rights reserved.
        </div>
    </div>

</body>
</html>
