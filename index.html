<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOBI MANAGER - Local Offline</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #161616;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #262626;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            letter-spacing: 1px;
            color: #f1f1f1;
        }
        p {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .status-box {
            background: #1f1f1f;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
            font-size: 14px;
            color: #ddd;
            margin-bottom: 15px;
            text-align: left;
        }
        .action-box {
            background: #1f1f1f;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #333;
            text-align: left;
        }
        .action-box label {
            font-size: 13px;
            color: #aaa;
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
            text-align: center;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            margin-bottom: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
        .btn-check {
            background-color: #2196F3;
        }
        .btn-check:hover {
            background-color: #0b7dda;
        }
        .result-text {
            font-size: 12px;
            margin-top: 5px;
            font-family: monospace;
            word-break: break-all;
        }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DOBI X MANAGER</h1>
        <p>Hệ thống xác thực Key độc lập</p>
        
        <div class="status-box">
            Trạng thái: <span style="color: #4CAF50; font-weight: bold;">Chạy trực tiếp trên máy (Offline)</span>
        </div>

        <!-- Khung tạo key mới -->
        <div class="action-box">
            <button onclick="createKey()">TẠO KEY MỚI NGAY</button>
            <div id="createResult" class="result-text success"></div>
        </div>

        <!-- Khung kiểm tra key trực tiếp -->
        <div class="action-box">
            <label>Kiểm tra tính hợp lệ của Key:</label>
            <input type="text" id="inputKeyToCheck" placeholder="Dán key vào đây...">
            <button class="btn-check" onclick="verifyKeyOnWeb()">KIỂM TRA KEY</button>
            <div id="checkResult" class="result-text"></div>
        </div>

        <div class="footer">
            &copy; 2026 Dobi Project. No Vercel / No Supabase.
        </div>
    </div>

    <script>
        const SECRET_SIGNATURE = "DOBI_SECRET_KEY_2026_PRO";

        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash).toString(36).toUpperCase();
        }

        function createKey() {
            const prefix = "DOBI";
            const randomPart = Math.random().toString(36).substring(2, 8).toUpperCase();
            const rawString = prefix + "-" + randomPart;
            const hashCheck = simpleHash(rawString + SECRET_SIGNATURE).substring(0, 6);
            const finalKey = `${rawString}-${hashCheck}`;

            const resultEl = document.getElementById("createResult");
            resultEl.className = "result-text success";
            resultEl.innerText = "Đã tạo & copy: " + finalKey;
            
            document.getElementById("inputKeyToCheck").value = finalKey;
            navigator.clipboard.writeText(finalKey);
        }

        function verifyKeyOnWeb() {
            const key = document.getElementById("inputKeyToCheck").value.trim();
            const resultEl = document.getElementById("checkResult");

            if (!key || !key.startsWith("DOBI-")) {
                resultEl.className = "result-text error";
                resultEl.innerText = "Key không hợp lệ hoặc sai định dạng!";
                return;
            }

            const parts = key.split("-");
            if (parts.length < 3) {
                resultEl.className = "result-text error";
                resultEl.innerText = "Key thiếu mã bảo mật!";
                return;
            }

            const rawString = parts[0] + "-" + parts[1];
            const clientSignature = parts[2];
            const expectedSignature = simpleHash(rawString + SECRET_SIGNATURE).substring(0, 6);

            if (clientSignature === expectedSignature) {
                resultEl.className = "result-text success";
                resultEl.innerText = "✓ Key hợp lệ, hệ thống chấp nhận!";
            } else {
                resultEl.className = "result-text error";
                resultEl.innerText = "✕ Key giả mạo hoặc chưa từng được tạo!";
            }
        }
    </script>

</body>
</html>
