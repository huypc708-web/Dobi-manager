<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOBI MANAGER - Key System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #161616;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #262626;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 5px;
            letter-spacing: 1px;
            color: #f1f1f1;
        }
        p {
            color: #888;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .status-box {
            background: #1f1f1f;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid #4CAF50;
            font-size: 13px;
            color: #ddd;
            margin-bottom: 15px;
        }
        .section {
            background: #1f1f1f;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #333;
        }
        input {
            width: 100%;
            padding: 9px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            margin-bottom: 8px;
            font-size: 13px;
            text-align: center;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        button:hover { background-color: #45a049; }
        .btn-check { background-color: #2196F3; }
        .btn-check:hover { background-color: #0b7dda; }
        .result-box {
            margin-top: 8px;
            padding: 8px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            display: none;
        }
        .success { background: #1b5e20; color: #a5d6a7; border: 1px solid #4CAF50; }
        .error { background: #b71c1c; color: #ffcdd2; border: 1px solid #f44336; }
        .footer {
            margin-top: 15px;
            font-size: 11px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DOBI X MANAGER</h1>
        <p>Hệ thống Quản lý & Xác thực Key</p>
        
        <div class="status-box">
            Trạng thái API: <span style="color: #4CAF50; font-weight: bold;">Đang hoạt động (Online)</span>[cite: 1, 2]
        </div>

        <!-- Khung Tạo Key trên Web -->
        <div class="section">
            <button onclick="createKey()">TẠO KEY MỚI NGAY</button>
            <div id="createResult" class="result-box"></div>
        </div>

        <!-- Khung Kiểm Tra Key Ngay trên Web -->
        <div class="section">
            <input type="text" id="inputKeyToCheck" placeholder="Nhập key cần test trực tiếp...">
            <button class="btn-check" onclick="verifyKeyOnWeb()">KIỂM TRA TRÊN WEB</button>
            <div id="checkResult" class="result-box"></div>
        </div>

        <div class="footer">
            &copy; 2026 Dobi Project. All rights reserved.[cite: 1, 2]
        </div>
    </div>

    <script>
        const SECRET_SIGNATURE = "DOBI_SECRET_KEY_2026_PRO";

        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash).toString(36).toUpperCase();
        }

        function createKey() {
            const prefix = "DOBI";
            const randomPart = Math.random().toString(36).substring(2, 8).toUpperCase();
            const rawString = prefix + "-" + randomPart;
            const hashCheck = simpleHash(rawString + SECRET_SIGNATURE).substring(0, 6);
            const finalKey = `${rawString}-${hashCheck}`;

            const resultBox = document.getElementById("createResult");
            resultBox.style.display = "block";
            resultBox.className = "result-box success";
            resultBox.innerText = "Đã tạo: " + finalKey;
            
            document.getElementById("inputKeyToCheck").value = finalKey;
            navigator.clipboard.writeText(finalKey);
        }

        function verifyKeyOnWeb() {
            const key = document.getElementById("inputKeyToCheck").value.trim();
            const resultBox = document.getElementById("checkResult");
            resultBox.style.display = "block";

            if (!key || !key.startsWith("DOBI-")) {
                resultBox.className = "result-box error";
                resultBox.innerText = "Key không hợp lệ hoặc sai định dạng!";
                return;
            }

            const parts = key.split("-");
            if (parts.length < 3) {
                resultBox.className = "result-box error";
                resultBox.innerText = "Key thiếu mã bảo mật!";
                return;
            }

            const rawString = parts[0] + "-" + parts[1];
            const clientSignature = parts[2];
            const expectedSignature = simpleHash(rawString + SECRET_SIGNATURE).substring(0, 6);

            if (clientSignature === expectedSignature) {
                resultBox.className = "result-box success";
                resultBox.innerText = "Hợp lệ! Key này chuẩn xác và dùng được ngay.";
            } else {
                resultBox.className = "result-box error";
                resultBox.innerText = "Không hợp lệ! Key giả mạo hoặc chưa từng được tạo.";
            }
        }
    </script>

</body>
</html>
