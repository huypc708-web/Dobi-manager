<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOBI MANAGER - Key System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #161616;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #262626;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 6px;
            letter-spacing: 1px;
            color: #f1f1f1;
        }
        p {
            color: #888;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .status-box {
            background: #1f1f1f;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
            font-size: 13px;
            color: #ddd;
            margin-bottom: 12px;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 8px;
            background: #111;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            margin-top: 6px;
            margin-bottom: 6px;
            font-size: 13px;
            text-align: center;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 9px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
            transition: 0.2s;
        }
        button:hover {
            background-color: #45a049;
        }
        .btn-check {
            background-color: #2196F3;
        }
        .btn-check:hover {
            background-color: #0b7dda;
        }
        .btn-reset {
            background-color: #ff9800;
        }
        .btn-reset:hover {
            background-color: #e68900;
        }
        .result-text {
            margin-top: 6px;
            font-size: 12px;
            font-family: monospace;
            word-break: break-all;
        }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .info { color: #ff9800; }
        .footer {
            margin-top: 10px;
            font-size: 11px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DOBI X MANAGER</h1>
        <p>Hệ thống quản lý & Xác thực Key</p>
        
        <div class="status-box">
            Trạng thái: <span style="color: #4CAF50; font-weight: bold;">Đang hoạt động (Online)</span>
        </div>

        <!-- Khung Tạo Key -->
        <div class="status-box">
            <button onclick="createKey()">TẠO KEY MỚI NGAY</button>
            <div id="createResult" class="result-text success"></div>
        </div>

        <!-- Khung Kiểm Tra Key & Đếm Ngược / Reset HWID -->
        <div class="status-box">
            <div style="font-size: 12px; color: #aaa;">Kiểm tra / Quản lý Key:</div>
            <input type="text" id="inputKeyToCheck" placeholder="Dán key vào đây...">
            <button class="btn-check" onclick="verifyKey()">KIỂM TRA THÔNG TIN</button>
            <button class="btn-reset" onclick="resetHwid()" style="margin-top: 6px;">RESET HWID (MỞ KHÓA MÁY)</button>
            <div id="checkResult" class="result-text"></div>
        </div>

        <div class="footer">
            &copy; 2026 Dobi Project. All rights reserved.
        </div>
    </div>

    <script>
        // Hàm tạo key mới mô phỏng
        function createKey() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let randomPart1 = "";
            let randomPart2 = "";
            for (let i = 0; i < 6; i++) randomPart1 += chars.charAt(Math.floor(Math.random() * chars.length));
            for (let i = 0; i < 6; i++) randomPart2 += chars.charAt(Math.floor(Math.random() * chars.length));
            
            const finalKey = `DOBI-${randomPart1}-${randomPart2}`;

            const resultEl = document.getElementById("createResult");
            resultEl.className = "result-text success";
            resultEl.innerText = "Đã tạo & copy: " + finalKey;
            
            document.getElementById("inputKeyToCheck").value = finalKey;
            navigator.clipboard.writeText(finalKey);
        }

        // Kiểm tra thông tin key, thời gian hết hạn (đếm ngược) và trạng thái HWID
        function verifyKey() {
            const key = document.getElementById("inputKeyToCheck").value.trim();
            const resultEl = document.getElementById("checkResult");

            if (!key || !key.startsWith("DOBI-")) {
                resultEl.className = "result-text error";
                resultEl.innerText = "Key sai định dạng hệ thống!";
                return;
            }

            // Giả lập thời hạn key (ví dụ: Key có hạn 24 giờ kể từ lúc kiểm tra hoặc hiển thị mẫu)
            resultEl.className = "result-text info";
            resultEl.innerHTML = `✓ Key hợp lệ!<br>• Trạng thái: Đang hoạt động<br>• Thiết bị (HWID): Chưa liên kết<br>• Thời gian còn lại: <span id="countdown" style="color: #4CAF50; font-weight: bold;">23h 59m 50s</span>`;
            
            // Chạy hiệu ứng đếm ngược giả lập thời gian sử dụng
            startCountdown(24 * 3600); 
        }

        function resetHwid() {
            const key = document.getElementById("inputKeyToCheck").value.trim();
            const resultEl = document.getElementById("checkResult");

            if (!key) {
                resultEl.className = "result-text error";
                resultEl.innerText = "Vui lòng nhập key cần reset HWID!";
                return;
            }

            resultEl.className = "result-text success";
            resultEl.innerText = "Đã Reset HWID thành công! Key có thể dùng cho máy mới.";
        }

        function startCountdown(durationSeconds) {
            let timer = durationSeconds;
            setInterval(function () {
                let hours = parseInt(timer / 3600, 10);
                let minutes = parseInt((timer % 3600) / 60, 10);
                let seconds = parseInt(timer % 60, 10);

                hours = hours < 10 ? "0" + hours : hours;
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                const cdElement = document.getElementById("countdown");
                if (cdElement) {
                    cdElement.textContent = hours + "h " + minutes + "m " + seconds + "s";
                }
                if (--timer < 0) {
                    timer = 0;
                }
            }, 1000);
        }
    </script>

</body>
</html>
