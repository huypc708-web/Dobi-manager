<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dobi Manager - Hệ thống Quản lý Đám mây</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
    :root {
        --bg-base: #09090b;
        --bg-surface: #121215;
        --bg-card: #18181b;
        --bg-card-hover: #1f1f23;
        --border-color: #27272a;
        --border-color-light: #3f3f46;
        
        --primary: #ffffff;
        --primary-glow: rgba(255, 255, 255, 0.15);
        --success: #10b981;
        --success-glow: rgba(16, 185, 129, 0.2);
        --warning: #f59e0b;
        --danger: #ef4444;
        --danger-glow: rgba(239, 68, 68, 0.2);
        --purple: #a855f7;
        
        --text-main: #ffffff;
        --text-muted: #a1a1aa;
        --text-dim: #71717a;
        
        --sidebar-width: 260px;
        --sidebar-width-collapsed: 76px;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    body {
        background-color: var(--bg-base);
        color: var(--text-muted);
        display: flex;
        height: 100vh;
        overflow: hidden;
        font-size: 14px;
    }

    ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        background: var(--border-color-light);
        border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: var(--text-dim);
    }

    #loginOverlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, #18181b 0%, #09090b 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }
    .login-box {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-color-light);
        padding: 45px 40px;
        border-radius: var(--radius-lg);
        width: 100%;
        max-width: 420px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
        position: relative;
        overflow: hidden;
    }
    .login-box::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 3px;
        background: linear-gradient(90deg, #ffffff, #71717a);
    }
    .login-box h2 {
        color: var(--text-main);
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
        text-align: center;
        letter-spacing: -0.5px;
    }
    .login-box p {
        color: var(--text-dim);
        font-size: 13px;
        text-align: center;
        margin-bottom: 30px;
    }
    .login-input-group {
        margin-bottom: 18px;
    }
    .login-input-group label {
        display: block;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .login-input-group input {
        width: 100%;
        background-color: var(--bg-base);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 13px 16px;
        border-radius: var(--radius-sm);
        font-size: 14px;
        outline: none;
        transition: var(--transition);
    }
    .login-input-group input:focus {
        border-color: var(--text-main);
        box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .btn-login {
        width: 100%;
        background: #ffffff;
        color: #09090b;
        border: none;
        padding: 13px;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: var(--transition);
        margin-top: 10px;
        box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
    }
    .btn-login:hover {
        opacity: 0.9;
        transform: translateY(-1px);
    }
    .login-error {
        color: var(--danger);
        font-size: 13px;
        text-align: center;
        margin-top: 16px;
        display: none;
        background: var(--danger-glow);
        padding: 10px;
        border-radius: var(--radius-sm);
        border: 1px solid rgba(239, 68, 68, 0.3);
    }

    #appContainer {
        display: none;
        width: 100%;
        height: 100%;
    }

    .sidebar {
        width: var(--sidebar-width);
        background-color: var(--bg-surface);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px 14px;
        overflow-y: auto;
        overflow-x: hidden;
        transition: var(--transition);
        position: relative;
    }
    
    .sidebar.collapsed {
        width: var(--sidebar-width-collapsed);
        padding: 20px 10px;
    }
    .sidebar.collapsed .user-info,
    .sidebar.collapsed .nav-item span,
    .sidebar.collapsed .sidebar-toggle-text {
        display: none;
    }
    .sidebar.collapsed .user-profile {
        justify-content: center;
        padding: 8px;
    }
    .sidebar.collapsed .nav-item {
        justify-content: center;
        padding: 12px;
    }
    .sidebar.collapsed .nav-item.active {
        border-left: none;
        background-color: var(--bg-card);
        border-radius: var(--radius-sm);
    }

    .sidebar-toggle-btn {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        color: var(--text-muted);
        padding: 8px 12px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        transition: var(--transition);
        margin-bottom: 15px;
        width: 100%;
    }
    .sidebar-toggle-btn:hover {
        background-color: var(--bg-card-hover);
        color: var(--text-main);
        border-color: var(--border-color-light);
    }
    .sidebar-toggle-btn svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
        transition: var(--transition);
    }
    .sidebar.collapsed .sidebar-toggle-btn svg {
        transform: rotate(180deg);
    }

    .user-profile {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        margin-bottom: 15px;
        transition: var(--transition);
    }
    .user-avatar {
        width: 38px;
        height: 38px;
        background: linear-gradient(135deg, #27272a, #18181b);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 700;
        font-size: 15px;
        flex-shrink: 0;
        border: 1px solid var(--border-color-light);
    }
    .user-info {
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .user-name {
        color: var(--text-main);
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .user-email {
        color: var(--success);
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .nav-menu {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        border-radius: var(--radius-sm);
        cursor: pointer;
        transition: var(--transition);
        white-space: nowrap;
    }
    .nav-item svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
        flex-shrink: 0;
        opacity: 0.7;
        transition: var(--transition);
    }
    .nav-item:hover {
        background-color: var(--bg-card);
        color: var(--text-main);
    }
    .nav-item:hover svg {
        opacity: 1;
    }
    .nav-item.active {
        background-color: var(--bg-card);
        color: var(--text-main);
        font-weight: 700;
        border-left: 3px solid var(--text-main);
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
    }
    .nav-item.active svg {
        fill: var(--text-main);
        opacity: 1;
    }

    .sidebar-bottom {
        border-top: 1px solid var(--border-color);
        padding-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .nav-item.danger {
        color: var(--danger);
    }
    .nav-item.danger:hover {
        background: var(--danger-glow);
        color: var(--danger);
    }

    .main-content {
        flex: 1;
        padding: 30px 40px;
        overflow-y: auto;
        background-color: var(--bg-base);
    }
    .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border-color);
    }
    .dashboard-title {
        color: var(--text-main);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
    }
    .status-badge {
        background: var(--success-glow);
        color: var(--success);
        border: 1px solid rgba(16, 185, 129, 0.3);
        padding: 6px 14px;
        border-radius: 30px;
        font-size: 12px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .status-badge::before {
        content: '';
        width: 7px;
        height: 7px;
        background-color: var(--success);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--success);
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .section-title-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    .section-title {
        color: var(--text-main);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.3px;
    }
    .btn-primary {
        background: #ffffff;
        color: #09090b;
        border: none;
        padding: 10px 18px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .btn-primary:hover {
        opacity: 0.9;
        transform: translateY(-1px);
    }
    
    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-bottom: 28px;
    }
    .stat-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        padding: 22px;
        border-radius: var(--radius-md);
        position: relative;
        overflow: hidden;
        transition: var(--transition);
    }
    .stat-card:hover {
        border-color: var(--border-color-light);
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .stat-card h4 {
        color: var(--text-dim);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin-bottom: 10px;
    }
    .stat-card .number {
        color: var(--text-main);
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -1px;
    }

    .filters-bar {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }
    .search-box, select, input[type="text"], input[type="number"], input[type="password"] {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 11px 16px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        outline: none;
        transition: var(--transition);
    }
    .search-box:focus, select:focus, input:focus {
        border-color: var(--text-main);
        box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .search-box { flex: 1; min-width: 250px; }
    select { cursor: pointer; }
    
    .table-container {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th {
        background-color: #121215;
        color: var(--text-dim);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.8px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border-color);
    }
    td { padding: 14px 18px; border-bottom: 1px solid var(--border-color); color: var(--text-muted); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background-color: rgba(255, 255, 255, 0.03); }
    .empty-state { text-align: center; padding: 50px 20px; color: var(--text-dim); font-style: italic; }
    
    .badge { padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; display: inline-block; letter-spacing: 0.3px; }
    .badge-active { background: var(--success-glow); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-banned { background: var(--danger-glow); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-type { background: rgba(255, 255, 255, 0.06); color: var(--text-main); border: 1px solid var(--border-color-light); }

    .action-btns {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
    }
    .btn-action {
        padding: 6px 12px;
        font-size: 11px;
        font-weight: 600;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        transition: var(--transition);
    }
    .btn-edit { background: rgba(255, 255, 255, 0.08); color: #ffffff; border: 1px solid var(--border-color-light); }
    .btn-edit:hover { background: #ffffff; color: #09090b; }
    .btn-reset { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.3); }
    .btn-reset:hover { background: #a855f7; color: #fff; }
    .btn-ban { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
    .btn-ban:hover { background: #f59e0b; color: #fff; }
    .btn-unban { background: var(--success-glow); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
    .btn-unban:hover { background: var(--success); color: #fff; }
    .btn-delete { background: var(--danger-glow); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-delete:hover { background: var(--danger); color: #fff; }

    .key-code, .account-text {
        color: var(--text-main);
        font-family: monospace;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
    }
    .key-code:hover, .account-text:hover { color: var(--text-muted); text-decoration: underline; }

    .instruction-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        padding: 24px;
        border-radius: var(--radius-md);
        margin-top: 20px;
    }
    .instruction-card h3 { color: var(--text-main); margin-bottom: 10px; font-size: 16px; font-weight: 700; }
    .instruction-card p { color: var(--text-muted); font-size: 13px; line-height: 1.6; }

    .modal {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(4px);
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    .modal-content {
        background: var(--bg-surface);
        border: 1px solid var(--border-color-light);
        padding: 30px;
        border-radius: var(--radius-lg);
        width: 100%;
        max-width: 440px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
    }
    .modal-content h3 { color: var(--text-main); margin-bottom: 20px; font-size: 18px; font-weight: 700; }
    .modal-content select, .modal-content input { width: 100%; margin-bottom: 14px; }
    .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .btn-cancel { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; transition: var(--transition); }
    .btn-cancel:hover { background: var(--bg-card-hover); color: var(--text-main); }

    #toast {
        visibility: hidden;
        min-width: 240px;
        background-color: var(--bg-surface);
        color: var(--text-main);
        text-align: center;
        border-radius: var(--radius-sm);
        padding: 14px 20px;
        position: fixed;
        z-index: 2000;
        right: 30px;
        bottom: 30px;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid var(--border-color-light);
        box-shadow: 0 10px 25px -5px rgba(0,0,0,0.6);
    }
    #
